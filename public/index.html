<!DOCTYPE html>
<html>
<head>
    <title>Neon Racer Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0ff; z-index: 10; pointer-events: none; }
        
        /* Chat Styling */
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0ff;
            padding: 10px;
            z-index: 20;
            box-shadow: 0 0 10px #0ff;
        }
        #messages {
            height: 150px;
            overflow-y: auto;
            color: #0ff;
            margin-bottom: 10px;
            font-size: 14px;
            word-wrap: break-word;
        }
        #chat-input {
            width: 93%;
            background: #000;
            border: 1px solid #0ff;
            color: #fff;
            padding: 5px;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>NEON RACER</h1>
        <p>WASD to Drive | Enter to Chat</p>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <input type="text" id="chat-input" placeholder="Type a message...">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const socket = io();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Neon Glow Effect
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer.addPass(bloom);

        // Environment
        const grid = new THREE.GridHelper(500, 100, 0xff00ff, 0x222222);
        scene.add(grid);
        const light = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(light);

        let playerCar;
        const otherPlayers = {};

        function createCar(color = 0x00ffff) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.5, 3), 
                new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2 })
            );
            body.position.y = 0.25;
            group.add(body);
            return group;
        }

        // Multiplayer Events
        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === socket.id) {
                    playerCar = createCar(0x00ffff);
                    scene.add(playerCar);
                } else {
                    otherPlayers[id] = createCar(0xff00ff);
                    scene.add(otherPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (data) => {
            otherPlayers[data.id] = createCar(0xff00ff);
            scene.add(otherPlayers[data.id]);
        });

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].position.set(data.info.x, 0, data.info.z);
                otherPlayers[data.id].rotation.y = data.info.rot;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        // Chat Logic
        const chatInput = document.getElementById('chat-input');
        const messagesDiv = document.getElementById('messages');

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                socket.emit('chatMessage', chatInput.value);
                chatInput.value = '';
                chatInput.blur(); // Unfocus so WASD works again
            }
        });

        socket.on('chatMessage', (data) => {
            const msg = document.createElement('div');
            msg.innerHTML = `<b>${data.id.substring(0, 5)}:</b> ${data.msg}`;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Movement Logic
        const keys = {};
        window.onkeydown = (e) => { if(document.activeElement !== chatInput) keys[e.key.toLowerCase()] = true; };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        let speed = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (playerCar) {
                if (keys['w']) speed += 0.005;
                if (keys['s']) speed -= 0.005;
                speed *= 0.96; // Friction
                playerCar.translateZ(speed);
                if (keys['a']) playerCar.rotation.y += 0.04;
                if (keys['d']) playerCar.rotation.y -= 0.04;

                socket.emit('playerMovement', { x: playerCar.position.x, z: playerCar.position.z, rot: playerCar.rotation.y });

                // Camera follow
                const relativeCameraOffset = new THREE.Vector3(0, 5, -10);
                const cameraOffset = relativeCameraOffset.applyMatrix4(playerCar.matrixWorld);
                camera.position.lerp(cameraOffset, 0.1);
                camera.lookAt(playerCar.position);
            }
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
