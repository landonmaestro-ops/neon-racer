<!DOCTYPE html>
<html>
<head>
    <title>Neon Racer: Cyber City</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0ff; z-index: 10; pointer-events: none; text-shadow: 0 0 5px #0ff; }
        #chat-container {
            position: absolute; bottom: 20px; left: 20px; width: 300px;
            background: rgba(0, 0, 0, 0.8); border: 2px solid #0ff; padding: 10px; z-index: 20;
        }
        #messages { height: 120px; overflow-y: auto; color: #0ff; margin-bottom: 10px; font-size: 13px; }
        #chat-input { width: 92%; background: #000; border: 1px solid #0ff; color: #fff; padding: 5px; outline: none; }
        .nitro-bar { color: #f0f; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>NEON RACER: CITY</h1>
        <p>WASD: Drive | SPACE: <span class="nitro-bar">NITRO BOOST</span></p>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <input type="text" id="chat-input" placeholder="Type to chat...">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const socket = io();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer.addPass(bloom);

        // Environment: Huge Grid and Skyscrapers
        scene.add(new THREE.GridHelper(2000, 100, 0xff00ff, 0x222222));
        
        function createBuildings() {
            const colors = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff00];
            for(let i = 0; i < 60; i++) {
                const h = 50 + Math.random() * 150; // Very tall
                const w = 10 + Math.random() * 15;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const geo = new THREE.BoxGeometry(w, h, w);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x111111, emissive: color, emissiveIntensity: 0.5 
                });
                const b = new THREE.Mesh(geo, mat);
                
                // Spread them out significantly
                b.position.set((Math.random() - 0.5) * 1000, h/2, (Math.random() - 0.5) * 1000);
                scene.add(b);
            }
        }
        createBuildings();

        const light = new THREE.PointLight(0xffffff, 10, 500);
        scene.add(light);

        let playerCar;
        const otherPlayers = {};

        function createCar(color = 0x00ffff) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 3), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2 }));
            body.position.y = 0.3;
            group.add(body);
            return group;
        }

        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === socket.id) {
                    playerCar = createCar(0x00ffff);
                    scene.add(playerCar);
                } else {
                    otherPlayers[id] = createCar(0xff00ff);
                    scene.add(otherPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (data) => {
            otherPlayers[data.id] = createCar(0xff00ff);
            scene.add(otherPlayers[data.id]);
        });

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].position.set(data.info.x, 0, data.info.z);
                otherPlayers[data.id].rotation.y = data.info.rot;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
        });

        // Chat Input Logic
        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                socket.emit('chatMessage', chatInput.value);
                chatInput.value = '';
                chatInput.blur();
            }
        });

        socket.on('chatMessage', (data) => {
            const msg = document.createElement('div');
            msg.innerHTML = `<b>${data.id.substring(0, 5)}:</b> ${data.msg}`;
            document.getElementById('messages').appendChild(msg);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });

        // Driving & Nitro Physics
        const keys = {};
        window.onkeydown = (e) => { if(document.activeElement !== chatInput) keys[e.code] = true; };
        window.onkeyup = (e) => keys[e.code] = false;

        let speed = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (playerCar) {
                const isNitro = keys['Space'];
                const accel = isNitro ? 0.015 : 0.005;
                const maxFov = isNitro ? 85 : 75;

                if (keys['KeyW']) speed += accel;
                if (keys['KeyS']) speed -= accel;
                speed *= 0.96; // Friction
                
                playerCar.translateZ(speed);
                if (keys['KeyA']) playerCar.rotation.y += 0.04;
                if (keys['KeyD']) playerCar.rotation.y -= 0.04;

                socket.emit('playerMovement', { x: playerCar.position.x, z: playerCar.position.z, rot: playerCar.rotation.y });

                // Smooth Camera + Nitro Zoom
                camera.fov = THREE.MathUtils.lerp(camera.fov, maxFov, 0.1);
                camera.updateProjectionMatrix();
                
                const offset = new THREE.Vector3(0, 6, -12).applyMatrix4(playerCar.matrixWorld);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(playerCar.position);
                light.position.copy(playerCar.position).y += 5;
            }
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
