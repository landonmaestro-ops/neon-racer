<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyArena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.9); }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
        #crosshair.hit { animation: hit 0.15s ease-out; }
        @keyframes hit { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(2); } 100% { transform: translate(-50%, -50%) scale(1); } }

        #health { position: absolute; bottom: 30px; left: 30px; color: white; font-size: 28px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ff4444; }
        #ammo { position: absolute; bottom: 30px; right: 30px; color: white; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px; border-right: 4px solid #4444ff; }
        #killFeed { position: absolute; top: 20px; right: 20px; color: white; text-align: right; font-size: 16px; display: flex; flex-direction: column; gap: 5px; max-width: 300px; }
        .killMsg { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; border-right: 3px solid #ffaa00; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        #timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 48px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 10px 30px; border-radius: 10px; }
        #leaderboard { position: absolute; top: 80px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 8px; min-width: 250px; }
        #leaderboard h3 { margin-bottom: 10px; color: #ffaa00; border-bottom: 2px solid #ffaa00; padding-bottom: 5px; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .leaderboard-entry.alive { color: #00ff00; }
        .leaderboard-entry.dead { color: #ff4444; opacity: 0.6; }

        #menu, #waitingScreen, #roundEndScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(20,20,40,0.95)); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; color: white; }
        #menu h1, #waitingScreen h1, #roundEndScreen h1 { font-size: 64px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(45deg, #ff4444, #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .subtitle { color: #aaa; margin-bottom: 30px; font-size: 18px; }
        .controls-info { display: grid; grid-template-columns: auto auto; gap: 10px 30px; margin: 20px 0; color: #ccc; font-size: 14px; }
        .controls-info span { color: #ffaa00; font-weight: bold; }
        
        .class-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .class-btn { padding: 20px 40px; font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; transition: all 0.3s; text-transform: uppercase; font-weight: bold; }
        .class-btn:hover { background: rgba(255,255,255,0.2); border-color: #ffaa00; transform: translateY(-2px); }
        .class-btn.assault { border-color: #ff6600; }
        .class-btn.sniper { border-color: #00ff00; }
        .class-btn.smg { border-color: #00ffff; }
        .class-btn.shotgun { border-color: #ff00ff; }
        
        #nameInput { padding: 15px 25px; font-size: 18px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; width: 300px; }
        #nameInput::placeholder { color: rgba(255,255,255,0.5); }
        
        .hidden { display: none !important; }
        
        #respawnBtn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: linear-gradient(45deg, #ff4444, #ffaa00); border: none; color: white; border-radius: 8px; margin-top: 20px; text-transform: uppercase; font-weight: bold; }
        #respawnBtn:hover { transform: scale(1.05); }
        
        #status { position: absolute; top: 10px; left: 10px; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: bold; z-index: 100; }
        #status.connected { background: #00ff00; color: black; }
        #status.disconnected { background: #ff4444; color: white; }
        #status.connecting { background: #ffaa00; color: black; }
        
        .waiting-box { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; text-align: center; }
    </style>
    <!-- CRITICAL: Load socket.io from same origin -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="status" class="connecting">Connecting...</div>

    <div id="menu">
        <h1>PolyArena</h1>
        <div class="subtitle">Free For All Deathmatch</div>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="15">
        <div class="controls-info">
            <div><span>WASD</span> Move</div>
            <div><span>SPACE</span> Jump</div>
            <div><span>C</span> Crouch / Slide</div>

            <div><span>ESC</span> Release Mouse</div>
        </div>
        <div class="class-grid">
            <button class="class-btn assault" data-class="ASSAULT">Assault</button>
            <button class="class-btn sniper" data-class="SNIPER">Sniper</button>
            <button class="class-btn smg" data-class="SMG">SMG</button>

        </div>

        <h1>Get Ready!</h1>
        <div class="subtitle">Round starting soon...</div>
        <div class="waiting-box">
            <p id="waitText">Waiting for next round...</p>
        </div>
    </div>

    <div id="roundEndScreen" class="hidden">
        <h1>Round Over</h1>
        <div id="winnerText"></div>
        <button id="respawnBtn">Play Again</button>
    </div>

    <div id="ui" class="hidden">
        <div id="crosshair"></div>
        <div id="timer">02:00</div>
        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <div id="leaderboardContent"></div>
        </div>
        <div id="killFeed"></div>
        <div id="health">HP: 100</div>
        <div id="ammo">Kills: 0</div>
    </div>

<script type="module">
import * as THREE from 'three';

// --- SIMPLE POINTER LOCK ---
class SimplePointerLock {
    constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.isLocked = false;
        this.yaw = 0;
        this.pitch = 0;
        
        this.onMouseMove = this.onMouseMove.bind(this);
        this.onPointerLockChange = this.onPointerLockChange.bind(this);
        
        document.addEventListener('mousemove', this.onMouseMove);
        document.addEventListener('pointerlockchange', this.onPointerLockChange);
    }
    
    lock() {
        if (!this.isLocked) {
            this.domElement.requestPointerLock().catch(err => {
                console.log('Pointer lock failed:', err.message);
            });
        }
    }
    
    unlock() {
        if (this.isLocked) {
            document.exitPointerLock();
        }
    }
    
    onPointerLockChange() {
        this.isLocked = document.pointerLockElement === this.domElement;
    }
    
    onMouseMove(event) {
        if (!this.isLocked) return;
        
        const movementX = event.movementX || event.mozMovementX || 0;
        const movementY = event.movementY || event.mozMovementY || 0;
        
        this.yaw -= movementX * 0.002;
        this.pitch -= movementY * 0.002;
        this.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.pitch));
        
        this.camera.rotation.order = 'YXZ';
        this.camera.rotation.y = this.yaw;
        this.camera.rotation.x = this.pitch;
    }
}

// --- CRITICAL FIX: Connect to same origin, no hardcoded URL ---
// This will automatically connect to the server serving this page
const SOCKET = io({
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 10,
    reconnectionDelay: 1000
});

const WORLD_SIZE = 100;
const FOV = 90;

// --- STATE ---
let camera, scene, renderer, controls;
let myId = null;
let myClass = 'ASSAULT';
let myName = '';
let players = {};
let bots = {};
let meshes = {};
let projectiles = {};
let gunModel = null;
let lastTime = performance.now();
let inputs = { keys: { w: false, a: false, s: false, d: false, space: false, crouch: false }, yaw: 0, pitch: 0 };
let gameState = 'LOBBY';
let isAlive = false;

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Materials
const matOrange = new THREE.MeshLambertMaterial({ color: 0xff6600 });
const matGreen = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
const matCyan = new THREE.MeshLambertMaterial({ color: 0x00ffff });
const matPurple = new THREE.MeshLambertMaterial({ color: 0xff00ff });
const matDarkGray = new THREE.MeshLambertMaterial({ color: 0x333333 });
const matBlack = new THREE.MeshLambertMaterial({ color: 0x111111 });
const matSkin = new THREE.MeshLambertMaterial({ color: 0xffccaa });

const classColors = { ASSAULT: matOrange, SNIPER: matGreen, SMG: matCyan, SHOTGUN: matPurple };

// --- INIT ---
function init() {
    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

    camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // Map
    generateMap();

    // Controls
    controls = new SimplePointerLock(camera, document.body);
    
    // Gun Model
    createGunModel();

    // Event Listeners
    setupSocketListeners();
    setupUI();
    setupInputs();
    
    window.addEventListener('resize', onWindowResize);

    animate();
}

function createGunModel() {
    const gunGroup = new THREE.Group();
    
    const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.4);
    const body = new THREE.Mesh(bodyGeo, matDarkGray);
    gunGroup.add(body);
    
    const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3);
    const barrel = new THREE.Mesh(barrelGeo, matBlack);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.z = -0.3;
    barrel.position.y = 0.05;
    gunGroup.add(barrel);
    
    const magGeo = new THREE.BoxGeometry(0.08, 0.2, 0.1);
    const mag = new THREE.Mesh(magGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
    mag.position.y = -0.15;
    mag.position.z = 0.05;
    mag.rotation.x = -0.3;
    gunGroup.add(mag);
    
    const scopeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.15);
    const scope = new THREE.Mesh(scopeGeo, matBlack);
    scope.rotation.x = Math.PI / 2;
    scope.position.y = 0.12;
    scope.position.z = -0.05;
    scope.visible = false;
    scope.name = 'scope';
    gunGroup.add(scope);
    
    gunGroup.position.set(0.3, -0.3, -0.5);
    camera.add(gunGroup);
    scene.add(camera);
    
    gunModel = gunGroup;
}

function updateGunVisibility() {
    if (!gunModel) return;
    const scope = gunModel.getObjectByName('scope');
    if (scope) scope.visible = myClass === 'SNIPER';
}

function generateMap() {
    const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 50, 50);
    const pos = groundGeo.attributes.position;
    
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 2 + Math.random() * 0.3;
        pos.setZ(i, z);
    }
    groundGeo.computeVertexNormals();
    
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a6741, flatShading: true });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(WORLD_SIZE * 2, 40, 0x000000, 0x000000);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    for (let i = 0; i < 80; i++) {
        const type = Math.random();
        let mesh;
        
        if (type < 0.33) {
            const s = Math.random() * 3 + 1;
            mesh = new THREE.Mesh(
                new THREE.DodecahedronGeometry(s, 0),
                new THREE.MeshLambertMaterial({ color: 0x888888, flatShading: true })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s * 0.6,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else if (type < 0.66) {
            const s = Math.random() * 2 + 1;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(s, s, s),
                new THREE.MeshLambertMaterial({ color: 0x8B4513 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else {
            const w = Math.random() * 4 + 2;
            const h = Math.random() * 3 + 2;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, 1),
                new THREE.MeshLambertMaterial({ color: 0x555555 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                h / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
            mesh.rotation.y = Math.random() * Math.PI;
        }
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }
}

function setupSocketListeners() {
    // Connection status
    SOCKET.on('connect', () => {
        console.log('Connected to server!');
        updateStatus('connected');
    });
    
    SOCKET.on('disconnect', () => {
        console.log('Disconnected from server');
        updateStatus('disconnected');
    });
    
    SOCKET.on('connect_error', (err) => {
        console.error('Connection error:', err.message);
        updateStatus('disconnected');
    });

    SOCKET.on('joined', (data) => {
        console.log('Joined game:', data);
        myId = data.id;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('waitingScreen').classList.remove('hidden');
        updateGunVisibility();
    });

    SOCKET.on('lobbyMode', (data) => {
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('waitingScreen').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.add('hidden');
        document.getElementById('ui').classList.add('hidden');
    });

    SOCKET.on('roundStart', (data) => {
        console.log('Round started!');
        gameState = 'PLAYING';
        isAlive = true;
        
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('waitingScreen').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.add('hidden');
        document.getElementById('ui').classList.remove('hidden');
        
        // Delay pointer lock
        setTimeout(() => {
            if (controls && !controls.isLocked) {
                controls.lock();
            }
        }, 500);
    });

    SOCKET.on('roundEnd', (data) => {
        gameState = 'ENDED';
        isAlive = false;
        
        if (controls) {
            controls.unlock();
        }
        
        document.getElementById('ui').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.remove('hidden');
        
        document.getElementById('winnerText').innerHTML = 
            `🏆 Winner: ${data.winner.name} with ${data.winner.kills} kills!`;
        
        const lbDiv = document.getElementById('finalLeaderboard');
        lbDiv.innerHTML = data.leaderboard.map((entry, i) => `
            <div class="waiting-entry ${entry.alive ? 'alive' : 'dead'}">
                <span>#${i + 1} ${entry.name}</span>
                <span>${entry.kills} kills</span>
                <span class="status-badge ${entry.alive ? 'playing' : 'dead'}">
                    ${entry.alive ? 'SURVIVED' : 'ELIMINATED'}
                </span>
            </div>
        `).join('');
    });

    SOCKET.on('worldUpdate', (state) => {
        gameState = state.state;
        
        // Update timer
        const minutes = Math.floor(state.time / 60);
        const seconds = state.time % 60;
        document.getElementById('timer').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Update players
        state.players.forEach(p => {
            if (p.id === myId) {
                document.getElementById('health').textContent = `HP: ${Math.ceil(p.hp)}`;
                document.getElementById('ammo').textContent = `Kills: ${p.kills}`;
                isAlive = p.alive;
                
                if (!p.alive && controls && controls.isLocked) {
                    controls.unlock();
                }
                return;
            }
            
            updateCombatantMesh(p, false);
        });
        
        // Update bots
        state.bots.forEach(b => {
            updateCombatantMesh(b, true);
        });
        
        // Update projectiles
        updateProjectiles(state.projectiles);
        
        // Cleanup disconnected
        for (const id in meshes) {
            const stillExists = state.players.find(p => p.id === id) || state.bots.find(b => b.id === id);
            if (!stillExists) {
                scene.remove(meshes[id].group);
                delete meshes[id];
            }
        }
        
        // Update leaderboard
        updateLeaderboard([...state.players, ...state.bots]);
        
        // Update kill feed
        if (state.killFeed) {
            const feedDiv = document.getElementById('killFeed');
            feedDiv.innerHTML = state.killFeed.map(k => 
                `<div class="killMsg">${k.msg}</div>`
            ).join('');
        }
    });

    SOCKET.on('playerFire', (data) => {
        createMuzzleFlash(data.origin, data.direction);
        
        const dist = Math.hypot(
            data.origin.x - camera.position.x,
            data.origin.z - camera.position.z
        );
        if (dist < 50 && data.playerId !== myId) {
            playSound('shoot', 0.2 * (1 - dist/50));
        }
    });

    SOCKET.on('botFire', (data) => {
        createMuzzleFlash(data.origin, data.direction);
        
        const dist = Math.hypot(
            data.origin.x - camera.position.x,
            data.origin.z - camera.position.z
        );
        if (dist < 50) {
            playSound('shoot', 0.2 * (1 - dist/50));
        }
    });

    SOCKET.on('hitMarker', (data) => {
        const ch = document.getElementById('crosshair');
        ch.classList.add('hit');
        if (data.kill) {
            ch.style.borderColor = '#ff0000';
            playSound('hit', 0.5);
        }
        setTimeout(() => {
            ch.classList.remove('hit');
            ch.style.borderColor = 'transparent';
        }, 150);
    });

    SOCKET.on('error', (data) => {
        alert(data.msg);
    });
}

function updateStatus(status) {
    const statusEl = document.getElementById('status');
    statusEl.className = status;
    if (status === 'connected') {
        statusEl.textContent = 'Connected';
        setTimeout(() => statusEl.style.display = 'none', 2000);
    } else if (status === 'disconnected') {
        statusEl.textContent = 'Disconnected - Refresh page';
        statusEl.style.display = 'block';
    } else if (status === 'connecting') {
        statusEl.textContent = 'Connecting...';
    }
}

function setupUI() {
    document.querySelectorAll('.class-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            if (!SOCKET || !SOCKET.connected) {
                alert('Not connected to server. Please wait or refresh.');
                return;
            }
            
            myClass = btn.dataset.class;
            const nameInput = document.getElementById('nameInput');
            myName = nameInput.value.trim() || `Player_${Math.floor(Math.random() * 1000)}`;
            
            console.log('Emitting joinGame:', { name: myName, classType: myClass });
            SOCKET.emit('joinGame', { name: myName, classType: myClass });
            
            // Visual feedback
            btn.style.background = 'rgba(255,170,0,0.5)';
            setTimeout(() => {
                btn.style.background = '';
            }, 200);
        });
    });
    
    document.getElementById('respawnBtn').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('roundEndScreen').classList.add('hidden');
        document.getElementById('menu').classList.remove('hidden');
        gameState = 'LOBBY';
        isAlive = false;
    });
}

function setupInputs() {
    document.addEventListener('keydown', (e) => {
        if (!isAlive || gameState !== 'PLAYING') return;
        
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = true;
        if (k === 'a') inputs.keys.a = true;
        if (k === 's') inputs.keys.s = true;
        if (k === 'd') inputs.keys.d = true;
        if (k === ' ') {
            e.preventDefault();
            inputs.keys.space = true;
        }
        if (k === 'c') inputs.keys.crouch = true;
    });
    
    document.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = false;
        if (k === 'a') inputs.keys.a = false;
        if (k === 's') inputs.keys.s = false;
        if (k === 'd') inputs.keys.d = false;
        if (k === ' ') inputs.keys.space = false;
        if (k === 'c') inputs.keys.crouch = false;
    });
    
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            if (controls && controls.isLocked && isAlive) {
                shoot();
            } else if (gameState === 'PLAYING' && isAlive && !controls.isLocked) {
                controls.lock();
            }
        }
    });
}

function shoot() {
    if (!isAlive || gameState !== 'PLAYING') return;
    
    if (gunModel) {
        gunModel.position.z += 0.05;
        setTimeout(() => {
            if (gunModel) gunModel.position.z -= 0.05;
        }, 50);
    }
    
    camera.rotation.x += 0.02;
    setTimeout(() => {
        camera.rotation.x -= 0.02;
    }, 50);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    
    const origin = new THREE.Vector3();
    camera.getWorldPosition(origin);
    origin.y -= 0.2;

    SOCKET.emit('shoot', {
        origin: { x: origin.x, y: origin.y, z: origin.z },
        direction: { x: dir.x, y: dir.y, z: dir.z }
    });

    playSound('shoot', 0.3);
}

function createMuzzleFlash(origin, direction) {
    const flash = new THREE.PointLight(0xffff00, 2, 5);
    flash.position.set(origin.x, origin.y, origin.z);
    scene.add(flash);
    
    setTimeout(() => {
        scene.remove(flash);
    }, 50);
}

function playSound(type, volume = 0.5) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
}

function updateCombatantMesh(data, isBot) {
    if (!meshes[data.id]) {
        const group = new THREE.Group();
        
        const bodyColor = classColors[data.classType] || matOrange;
        
        // Torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), bodyColor);
        torso.position.y = 1.35;
        torso.castShadow = true;
        group.add(torso);
        
        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matSkin);
        head.position.y = 2.0;
        head.castShadow = true;
        group.add(head);
        
        // Arms
        const armGeo = new THREE.BoxGeometry(0.15, 0.4, 0.15);
        
        const leftArm = new THREE.Mesh(armGeo, matSkin);
        leftArm.position.set(-0.45, 1.6, 0);
        leftArm.name = 'leftArm';
        group.add(leftArm);
        
        const rightArm = new THREE.Mesh(armGeo, matSkin);
        rightArm.position.set(0.45, 1.6, 0);
        rightArm.name = 'rightArm';
        group.add(rightArm);
        
        // Forearms
        const forearmGeo = new THREE.BoxGeometry(0.12, 0.35, 0.12);
        
        const leftForearm = new THREE.Mesh(forearmGeo, matSkin);
        leftForearm.position.set(-0.45, 1.2, 0.1);
        leftForearm.name = 'leftForearm';
        group.add(leftForearm);
        
        const rightForearm = new THREE.Mesh(forearmGeo, matSkin);
        rightForearm.position.set(0.45, 1.2, 0.1);
        rightForearm.name = 'rightForearm';
        group.add(rightForearm);
        
        // Legs
        const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
        
        const leftLeg = new THREE.Mesh(legGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
        leftLeg.position.set(-0.2, 0.7, 0);
        leftLeg.name = 'leftLeg';
        group.add(leftLeg);
        
        const rightLeg = new THREE.Mesh(legGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
        rightLeg.position.set(0.2, 0.7, 0);
        rightLeg.name = 'rightLeg';
        group.add(rightLeg);
        
        // Lower legs
        const lowerLegGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
        
        const leftLowerLeg = new THREE.Mesh(lowerLegGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
        leftLowerLeg.position.set(-0.2, 0.25, 0);
        leftLowerLeg.name = 'leftLowerLeg';
        group.add(leftLowerLeg);
        
        const rightLowerLeg = new THREE.Mesh(lowerLegGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
        rightLowerLeg.position.set(0.2, 0.25, 0);
        rightLowerLeg.name = 'rightLowerLeg';
        group.add(rightLowerLeg);
        
        // Gun
        const gunGroup = new THREE.Group();
        
        const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.3), matDarkGray);
        gunGroup.add(gunBody);
        
        const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2), matBlack);
        gunBarrel.rotation.x = Math.PI / 2;
        gunBarrel.position.z = -0.2;
        gunBarrel.position.y = 0.04;
        gunGroup.add(gunBarrel);
        
        gunGroup.position.set(0.25, 1.3, 0.3);
        gunGroup.name = 'gun';
        group.add(gunGroup);
        
        scene.add(group);
        meshes[data.id] = { group, parts: { leftArm, rightArm, leftLeg, rightLeg, leftLowerLeg, rightLowerLeg, gun: gunGroup } };
    }
    
    const meshData = meshes[data.id];
    const group = meshData.group;
    
    group.position.set(data.x, data.y, data.z);
    group.quaternion.set(data.qx, data.qy, data.qz, data.qw);
    
    // Animate limbs
    if (isBot && data.walkCycle) {
        const walkCycle = data.walkCycle || 0;
        const parts = meshData.parts;
        
        parts.leftArm.rotation.x = Math.sin(walkCycle) * 0.5;
        parts.rightArm.rotation.x = Math.sin(walkCycle + Math.PI) * 0.5;
        
        parts.leftForearm.rotation.x = Math.sin(walkCycle) * 0.3 - 0.2;
        parts.rightForearm.rotation.x = Math.sin(walkCycle + Math.PI) * 0.3 - 0.2;
        
        parts.leftLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.6;
        parts.rightLeg.rotation.x = Math.sin(walkCycle) * 0.6;
        
        parts.leftLowerLeg.rotation.x = Math.max(0, Math.sin(walkCycle + Math.PI) * 0.8);
        parts.rightLowerLeg.rotation.x = Math.max(0, Math.sin(walkCycle) * 0.8);
        
        parts.gun.rotation.z = Math.sin(walkCycle * 2) * 0.05;
    }
    
    // Slide animation
    if (data.sliding) {
        group.scale.set(1.3, 0.6, 1.3);
    } else {
        group.scale.set(1, 1, 1);
    }
    
    // Death animation
    if (!data.alive) {
        group.rotation.x = Math.PI / 2;
        group.position.y = 0.5;
    }
}

function updateLeaderboard(allCombatants) {
    allCombatants.sort((a, b) => {
        if (a.alive && !b.alive) return -1;
        if (!a.alive && b.alive) return 1;
        return b.kills - a.kills;
    });
    
    const lbDiv = document.getElementById('leaderboardContent');
    lbDiv.innerHTML = allCombatants.slice(0, 10).map((p, i) => `
        <div class="leaderboard-entry ${p.alive ? 'alive' : 'dead'}">
            <span>${i + 1}. ${p.name}</span>
            <span>${p.kills}</span>
        </div>
    `).join('');
}

// Projectile management
let projectileMeshes = {};

function updateProjectiles(serverProjectiles) {
    // Remove old projectiles
    for (const id in projectileMeshes) {
        const stillExists = serverProjectiles.find(p => p.id === id);
        if (!stillExists) {
            scene.remove(projectileMeshes[id]);
            delete projectileMeshes[id];
        }
    }
    
    // Update or create projectiles
    serverProjectiles.forEach(p => {
        if (!projectileMeshes[p.id]) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            projectileMeshes[p.id] = mesh;
        }
        
        projectileMeshes[p.id].position.set(p.x, p.y, p.z);
    });
}

// --- MAIN LOOP ---
function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (gameState === 'PLAYING') {
        if (isAlive && controls && controls.isLocked) {
            // Send inputs to server
            SOCKET.emit('input', {
                keys: inputs.keys,
                quaternion: { 
                    x: camera.quaternion.x, 
                    y: camera.quaternion.y, 
                    z: camera.quaternion.z, 
                    w: camera.quaternion.w 
                },
                yaw: inputs.yaw,
                pitch: inputs.pitch
            });
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Wait for DOM and socket
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        init();
    }, 500);
});
</script>
