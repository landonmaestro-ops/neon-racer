<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyArena - Slide Hop FPS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); mix-blend-mode: difference;
        }
        #health {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 5px black;
        }
        #killFeed {
            position: absolute; top: 20px; right: 20px;
            color: white; text-align: right; font-size: 14px;
            text-shadow: 0 0 2px black; display: flex; flex-direction: column-reverse;
        }
        .killMsg { margin-bottom: 5px; opacity: 1; transition: opacity 2s; }
        #hardpoint {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 10px; background: #333; border: 2px solid #555;
        }
        #hpBar {
            width: 50%; height: 100%; background: #fff; transition: width 0.2s;
        }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; z-index: 10;
        }
        button { padding: 15px 30px; font-size: 20px; margin: 10px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="menu">
    <h1 style="color:white; font-family: monospace;">POLY_ARENA</h1>
    <div style="color:#aaa; margin-bottom:20px;">WASD to Move | SPACE to Jump | C to Crouch/Slide | CLICK to Shoot</div>
    <button id="btnAssault">Assault</button>
    <button id="btnSniper">Sniper</button>
    <button id="btnSmg">SMG</button>
    <button id="btnShotgun">Shotgun</button>
</div>

<div id="ui" class="hidden">
    <div id="crosshair"></div>
    <div id="hardpoint"><div id="hpBar"></div></div>
    <div id="killFeed"></div>
    <div id="health">HP: 100</div>
</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js'; // Not standard, using math util instead

// --- CONFIG ---
const SOCKET = io();
const WORLD_SIZE = 200;
const FOV = 80;

// --- STATE ---
let camera, scene, renderer, controls;
let myId = null;
let myTeam = null;
let players = {}; // Remote player meshes
let tracers = [];
let lastTime = performance.now();
let inputs = { keys: { w: false, a: false, s: false, d: false, space: false, crouch: false }, mouseX: 0, mouseY: 0 };
let myClass = 'ASSAULT';

// Spatial Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const listener = audioCtx.listener;

// --- ASSETS (Procedural) ---
const geometryBox = new THREE.BoxGeometry(1, 1, 1);
const matRed = new THREE.MeshLambertMaterial({ color: 0xff4444 });
const matBlue = new THREE.MeshLambertMaterial({ color: 0x4444ff });
const matNeutral = new THREE.MeshLambertMaterial({ color: 0x888888 });
const matBullet = new THREE.MeshBasicMaterial({ color: 0xffff00 });

// --- INIT ---
function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

    camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // Map Generation (Low Poly)
    generateMap();

    // Controls
    controls = new PointerLockControls(camera, document.body);
    
    // UI Events
    document.getElementById('btnAssault').onclick = () => startGame('ASSAULT');
    document.getElementById('btnSniper').onclick = () => startGame('SNIPER');
    document.getElementById('btnSmg').onclick = () => startGame('SMG');
    document.getElementById('btnShotgun').onclick = () => startGame('SHOTGUN');

    // Input Listeners
    document.addEventListener('keydown', (e) => handleKey(e, true));
    document.addEventListener('keyup', (e) => handleKey(e, false));
    document.addEventListener('mousedown', (e) => {
        if (controls.isLocked) shoot();
    });
    window.addEventListener('resize', onWindowResize);

    // Start Loop
    animate();
}

function generateMap() {
    // Ground
    const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 40, 40);
    // Displace vertices for low poly terrain
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        // Simple pseudo-random terrain
        const z = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 2 + Math.random() * 0.5;
        pos.setZ(i, z);
    }
    groundGeo.computeVertexNormals();
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a5f0b, flatShading: true });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Random Obstacles (Low Poly Rocks/Crates)
    for (let i = 0; i < 100; i++) {
        const s = Math.random() * 3 + 1;
        const mesh = new THREE.Mesh(geometryBox, matNeutral);
        mesh.position.set(
            (Math.random() - 0.5) * WORLD_SIZE,
            s / 2,
            (Math.random() - 0.5) * WORLD_SIZE
        );
        mesh.scale.set(s, s, s);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }
}

function startGame(classType) {
    myClass = classType;
    SOCKET.emit('joinGame', { classType });
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('ui').classList.remove('hidden');
    controls.lock();
}

function handleKey(e, isDown) {
    const k = e.key.toLowerCase();
    if (k === 'w') inputs.keys.w = isDown;
    if (k === 'a') inputs.keys.a = isDown;
    if (k === 's') inputs.keys.s = isDown;
    if (k === 'd') inputs.keys.d = isDown;
    if (k === ' ') inputs.keys.space = isDown;
    if (k === 'c' || k === 'control') inputs.keys.crouch = isDown;
}

// --- NETWORKING ---
SOCKET.on('init', (data) => {
    myId = data.id;
    myTeam = data.team;
    updateHardpointUI(data.hardpoint);
});

SOCKET.on('worldUpdate', (state) => {
    // Update Remote Players
    state.players.forEach(p => {
        if (p.id === myId) {
            // Reconciliation: We trust the server for HP, but we predict movement locally.
            // For this demo, we just update HP.
            document.getElementById('health').innerText = `HP: ${Math.ceil(p.hp)}`;
            return;
        }

        if (!players[p.id]) {
            // Create new player mesh
            const group = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), p.team === 'red' ? matRed : matBlue);
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({color:0xffffff}));
            head.position.y = 2.2;
            group.add(head);

            // Weapon
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.8), new THREE.MeshLambertMaterial({color:0x333333}));
            gun.position.set(0.5, 1.5, 0.5);
            group.add(gun);

            scene.add(group);
            players[p.id] = { mesh: group, name: p.name, classType: p.classType };
        }

        // Interpolation
        const target = players[p.id];
        target.mesh.position.set(p.x, p.y, p.z);
        target.mesh.quaternion.set(p.qx, p.qy, p.qz, p.qw);
        
        // Slide animation (squash)
        if (p.sliding) {
            target.mesh.scale.set(1.5, 0.5, 1.5);
        } else {
            target.mesh.scale.set(1, 1, 1);
        }
    });

    // Remove disconnected
    for (const id in players) {
        if (!state.players.find(p => p.id === id)) {
            scene.remove(players[id].mesh);
            delete players[id];
        }
    }

    // Update Hardpoint
    updateHardpointUI(state.hardpoint);
});

SOCKET.on('tracer', (data) => {
    createTracer(data.origin, data.direction);
    playSpatialSound(data.origin, 'shoot');
});

SOCKET.on('killFeed', (data) => {
    const div = document.createElement('div');
    div.className = 'killMsg';
    div.innerText = data.msg;
    const feed = document.getElementById('killFeed');
    feed.appendChild(div);
    if (feed.children.length > 5) feed.removeChild(feed.firstChild);
    setTimeout(() => div.style.opacity = 0, 4000);
});

SOCKET.on('hitMarker', () => {
    const ch = document.getElementById('crosshair');
    ch.style.background = 'red';
    ch.style.transform = 'translate(-50%, -50%) scale(2)';
    setTimeout(() => {
        ch.style.background = 'rgba(255,255,255,0.8)';
        ch.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 100);
});

// --- GAME LOGIC ---

function shoot() {
    // Visual Recoil
    camera.rotation.x += 0.05;

    // Raycast from camera
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const origin = new THREE.Vector3();
    camera.getWorldPosition(origin);

    SOCKET.emit('shoot', {
        origin: { x: origin.x, y: origin.y, z: origin.z },
        direction: { x: dir.x, y: dir.y, z: dir.z }
    });

    createTracer(origin, dir);
    playLocalSound('shoot');
}

function createTracer(origin, dir) {
    const length = 50;
    const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -length)
    ]);
    const line = new THREE.Line(geometry, matBullet);
    
    line.position.set(origin.x, origin.y, origin.z);
    line.lookAt(origin.x + dir.x, origin.y + dir.y, origin.z + dir.z);
    
    scene.add(line);
    tracers.push({ mesh: line, life: 0.1 });
}

function updateHardpointUI(hp) {
    const bar = document.getElementById('hpBar');
    const total = hp.progress.red + hp.progress.blue;
    if (total > 0) {
        const pct = (hp.progress[myTeam] / total) * 100;
        bar.style.width = pct + '%';
        bar.style.background = myTeam === 'red' ? '#ff4444' : '#4444ff';
    }
}

// --- AUDIO SYSTEM (Spatial) ---
function playLocalSound(type) {
    // Simple oscillator beep for local actions
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
}

function playSpatialSound(pos, type) {
    // Create a panner node for 3D audio
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const panner = audioCtx.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'inverse';
    panner.refDistance = 1;
    panner.maxDistance = 100;
    panner.rolloffFactor = 1;
    panner.coneInnerAngle = 360;
    panner.coneOuterAngle = 0;
    panner.coneOuterGain = 0;
    
    panner.positionX.value = pos.x;
    panner.positionY.value = pos.y;
    panner.positionZ.value = pos.z;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(panner);
    panner.connect(audioCtx.destination);
    
    // Gunshot sound synthesis
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    
    // Noise buffer for gunshot crack would be better, but oscillator for simplicity
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

// --- MAIN LOOP ---
function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (controls.isLocked) {
        // Send inputs to server
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        const yaw = Math.atan2(dir.x, dir.z);
        
        SOCKET.emit('input', {
            keys: inputs.keys,
            quaternion: { x: camera.quaternion.x, y: camera.quaternion.y, z: camera.quaternion.z, w: camera.quaternion.w },
            yaw: yaw
        });

        // Update Listener Position for Spatial Audio
        const p = camera.position;
        if (listener.positionX) {
            listener.positionX.value = p.x;
            listener.positionY.value = p.y;
            listener.positionZ.value = p.z;
        }
    }

    // Update Tracers
    for (let i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        if (tracers[i].life <= 0) {
            scene.remove(tracers[i].mesh);
            tracers.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
<script src="/socket.io/socket.io.js"></script>
</body>
</html>
