<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyArena - FFA Deathmatch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
        }
        
        #gameCanvas { display: block; }
        
        #ui {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }
        
        #crosshair {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 20px; 
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        
        #crosshair.hit {
            animation: hitMarker 0.15s ease-out;
        }
        
        @keyframes hitMarker {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        #health {
            position: absolute; 
            bottom: 30px; 
            left: 30px;
            color: white; 
            font-size: 28px; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border-left: 4px solid #ff4444;
        }
        
        #ammo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border-right: 4px solid #4444ff;
        }
        
        #killFeed {
            position: absolute; 
            top: 20px; 
            right: 20px;
            color: white; 
            text-align: right; 
            font-size: 16px;
            text-shadow: 0 0 4px black; 
            display: flex; 
            flex-direction: column;
            gap: 5px;
            max-width: 300px;
        }
        
        .killMsg { 
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            border-right: 3px solid #ffaa00;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 10px 30px;
            border-radius: 10px;
        }
        
        #leaderboard {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            min-width: 250px;
        }
        
        #leaderboard h3 {
            margin-bottom: 10px;
            color: #ffaa00;
            border-bottom: 2px solid #ffaa00;
            padding-bottom: 5px;
        }
        
        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .leaderboard-entry.alive {
            color: #00ff00;
        }
        
        .leaderboard-entry.dead {
            color: #ff4444;
            opacity: 0.6;
        }

        #menu, #waitingScreen, #roundEndScreen {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(20,20,40,0.95));
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            pointer-events: auto; 
            z-index: 10;
            color: white;
        }
        
        #menu h1, #waitingScreen h1, #roundEndScreen h1 {
            font-size: 64px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ff4444, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,68,68,0.5);
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 18px;
        }
        
        .controls-info {
            display: grid;
            grid-template-columns: auto auto;
            gap: 10px 30px;
            margin: 20px 0;
            color: #ccc;
            font-size: 14px;
        }
        
        .controls-info span {
            color: #ffaa00;
            font-weight: bold;
        }
        
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .class-btn {
            padding: 20px 40px;
            font-size: 18px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .class-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        
        .class-btn.assault { border-color: #ff6600; }
        .class-btn.sniper { border-color: #00ff00; }
        .class-btn.smg { border-color: #00ffff; }
        .class-btn.shotgun { border-color: #ff00ff; }
        
        #nameInput {
            padding: 15px 25px;
            font-size: 18px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            width: 300px;
        }
        
        #nameInput::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .hidden { display: none !important; }
        
        .waiting-list {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            min-width: 400px;
        }
        
        .waiting-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-badge.waiting { background: #ffaa00; color: black; }
        .status-badge.playing { background: #00ff00; color: black; }
        .status-badge.dead { background: #ff4444; color: white; }
        
        #winnerAnnouncement {
            font-size: 32px;
            color: #ffaa00;
            margin: 20px 0;
            text-align: center;
        }
        
        .countdown {
            font-size: 24px;
            color: #00ffff;
            margin-top: 20px;
        }
        
        #respawnBtn {
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4444, #ffaa00);
            border: none;
            color: white;
            border-radius: 8px;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #respawnBtn:hover {
            transform: scale(1.05);
        }
        
        /* CRITICAL FIX: Add visible feedback for button press */
        .class-btn:active {
            transform: scale(0.95);
            background: rgba(255,170,0,0.3);
        }
        
        /* Connection status indicator */
        #connectionStatus {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
        }
        
        #connectionStatus.connected {
            background: #00ff00;
            color: black;
        }
        
        #connectionStatus.disconnected {
            background: #ff4444;
            color: white;
        }
        
        #connectionStatus.connecting {
            background: #ffaa00;
            color: black;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- CRITICAL FIX: Connection status indicator -->
    <div id="connectionStatus" class="connecting">Connecting...</div>

<div id="menu">
    <h1>PolyArena</h1>
    <div class="subtitle">Free For All Deathmatch</div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="15">
    <div class="controls-info">
        <div><span>WASD</span> Move</div>
        <div><span>SPACE</span> Jump</div>
        <div><span>C</span> Crouch / Slide</div>
        <div><span>MOUSE</span> Aim / Shoot</div>
        <div><span>SHIFT</span> Hold to Slide</div>
        <div><span>ESC</span> Release Mouse</div>
    </div>
    <div class="class-grid">
        <button class="class-btn assault" data-class="ASSAULT">Assault</button>
        <button class="class-btn sniper" data-class="SNIPER">Sniper</button>
        <button class="class-btn smg" data-class="SMG">SMG</button>
        <button class="class-btn shotgun" data-class="SHOTGUN">Shotgun</button>
    </div>
</div>

<div id="waitingScreen" class="hidden">
    <h1>Waiting for Next Round</h1>
    <div class="subtitle">Get ready to fight!</div>
    <div id="waitingInfo"></div>
    <div class="waiting-list" id="waitingLeaderboard"></div>
    <div class="countdown" id="waitingCountdown"></div>
</div>

<div id="roundEndScreen" class="hidden">
    <h1>Round Over</h1>
    <div id="winnerAnnouncement"></div>
    <div class="waiting-list" id="finalLeaderboard"></div>
    <button id="respawnBtn">Play Again</button>
</div>

<div id="ui" class="hidden">
    <div id="crosshair"></div>
    <div id="timer">02:00</div>
    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <div id="leaderboardContent"></div>
    </div>
    <div id="killFeed"></div>
    <div id="health">HP: 100</div>
    <div id="ammo">Kills: 0</div>
</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// --- CONFIG ---
// CRITICAL FIX: Initialize socket with error handling
let SOCKET;
try {
    SOCKET = io({
        transports: ['websocket', 'polling'], // Fallback for reliability
        reconnection: true,
        reconnectionAttempts: 5
    });
} catch (e) {
    console.error('Socket initialization failed:', e);
    alert('Failed to connect to server. Please refresh the page.');
}

const WORLD_SIZE = 100;
const FOV = 90;

// --- STATE ---
let camera, scene, renderer, controls;
let myId = null;
let myClass = 'ASSAULT';
let myName = '';
let players = {};
let bots = {};
let meshes = {};
let projectiles = [];
let gunModel = null;
let lastTime = performance.now();
let inputs = { 
    keys: { w: false, a: false, s: false, d: false, space: false, crouch: false, shift: false }, 
    mouseX: 0, 
    mouseY: 0,
    yaw: 0,
    pitch: 0
};
let gameState = 'LOBBY';
let myKills = 0;
let isAlive = false;

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Materials
const matRed = new THREE.MeshLambertMaterial({ color: 0xff4444 });
const matBlue = new THREE.MeshLambertMaterial({ color: 0x4444ff });
const matGreen = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
const matYellow = new THREE.MeshBasicMaterial({ color: 0xffff00 });
const matPurple = new THREE.MeshLambertMaterial({ color: 0xff00ff });
const matCyan = new THREE.MeshLambertMaterial({ color: 0x00ffff });
const matOrange = new THREE.MeshLambertMaterial({ color: 0xff6600 });
const matDarkGray = new THREE.MeshLambertMaterial({ color: 0x333333 });
const matBlack = new THREE.MeshLambertMaterial({ color: 0x111111 });
const matSkin = new THREE.MeshLambertMaterial({ color: 0xffccaa });

const classColors = {
    ASSAULT: matOrange,
    SNIPER: matGreen,
    SMG: matCyan,
    SHOTGUN: matPurple
};

// --- INIT ---
function init() {
    // CRITICAL FIX: Wait for socket connection before initializing
    if (!SOCKET) {
        console.error('Socket not initialized');
        return;
    }

    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

    camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // Map
    generateMap();

    // Controls - CRITICAL FIX: Properly initialize with domElement
    controls = new PointerLockControls(camera, document.body);
    
    // Gun Model
    createGunModel();

    // Event Listeners - CRITICAL FIX: Setup UI after socket is ready
    setupSocketListeners();
    setupUI();
    setupInputs();
    
    window.addEventListener('resize', onWindowResize);

    animate();
}

function createGunModel() {
    const gunGroup = new THREE.Group();
    
    // Main body
    const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.4);
    const body = new THREE.Mesh(bodyGeo, matDarkGray);
    gunGroup.add(body);
    
    // Barrel
    const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3);
    const barrel = new THREE.Mesh(barrelGeo, matBlack);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.z = -0.3;
    barrel.position.y = 0.05;
    gunGroup.add(barrel);
    
    // Magazine
    const magGeo = new THREE.BoxGeometry(0.08, 0.2, 0.1);
    const mag = new THREE.Mesh(magGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
    mag.position.y = -0.15;
    mag.position.z = 0.05;
    mag.rotation.x = -0.3;
    gunGroup.add(mag);
    
    // Scope (for sniper)
    const scopeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.15);
    const scope = new THREE.Mesh(scopeGeo, matBlack);
    scope.rotation.x = Math.PI / 2;
    scope.position.y = 0.12;
    scope.position.z = -0.05;
    scope.visible = false;
    scope.name = 'scope';
    gunGroup.add(scope);
    
    // Position relative to camera
    gunGroup.position.set(0.3, -0.3, -0.5);
    camera.add(gunGroup);
    scene.add(camera);
    
    gunModel = gunGroup;
}

function updateGunVisibility() {
    if (!gunModel) return;
    const scope = gunModel.getObjectByName('scope');
    if (scope) scope.visible = myClass === 'SNIPER';
}

function generateMap() {
    // Ground with grid pattern
    const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 50, 50);
    const pos = groundGeo.attributes.position;
    
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 2 + Math.random() * 0.3;
        pos.setZ(i, z);
    }
    groundGeo.computeVertexNormals();
    
    const groundMat = new THREE.MeshLambertMaterial({ 
        color: 0x4a6741, 
        flatShading: true 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper for visual reference
    const grid = new THREE.GridHelper(WORLD_SIZE * 2, 40, 0x000000, 0x000000);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    // Random obstacles
    for (let i = 0; i < 80; i++) {
        const type = Math.random();
        let mesh;
        
        if (type < 0.33) {
            // Rock
            const s = Math.random() * 3 + 1;
            mesh = new THREE.Mesh(
                new THREE.DodecahedronGeometry(s, 0),
                new THREE.MeshLambertMaterial({ color: 0x888888, flatShading: true })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s * 0.6,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else if (type < 0.66) {
            // Crate
            const s = Math.random() * 2 + 1;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(s, s, s),
                new THREE.MeshLambertMaterial({ color: 0x8B4513 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else {
            // Wall
            const w = Math.random() * 4 + 2;
            const h = Math.random() * 3 + 2;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, 1),
                new THREE.MeshLambertMaterial({ color: 0x555555 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                h / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
            mesh.rotation.y = Math.random() * Math.PI;
        }
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }
}

// CRITICAL FIX: Separate socket listeners setup
function setupSocketListeners() {
    // Connection status handling
    SOCKET.on('connect', () => {
        console.log('Connected to server');
        updateConnectionStatus('connected');
    });
    
    SOCKET.on('disconnect', () => {
        console.log('Disconnected from server');
        updateConnectionStatus('disconnected');
    });
    
    SOCKET.on('connect_error', (err) => {
        console.error('Connection error:', err);
        updateConnectionStatus('disconnected');
    });

    SOCKET.on('joined', (data) => {
        console.log('Joined game:', data);
        myId = data.id;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('waitingScreen').classList.remove('hidden');
        updateGunVisibility();
    });

    SOCKET.on('lobbyMode', (data) => {
        console.log('Lobby mode:', data);
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('waitingScreen').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.add('hidden');
        document.getElementById('ui').classList.add('hidden');
        
        // Update waiting screen info
        const infoDiv = document.getElementById('waitingInfo');
        if (infoDiv) {
            infoDiv.innerHTML = `<p>Game State: ${data.gameState}</p><p>Time until start: ${Math.ceil(data.timeUntilStart)}s</p>`;
        }
    });

    SOCKET.on('roundStart', (data) => {
        console.log('Round started:', data);
        gameState = 'PLAYING';
        isAlive = true;
        myKills = 0;
        
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('waitingScreen').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.add('hidden');
        document.getElementById('ui').classList.remove('hidden');
        
        // CRITICAL FIX: Delay pointer lock to ensure DOM is ready
        setTimeout(() => {
            if (controls && !controls.isLocked) {
                controls.lock().catch(err => {
                    console.log('Pointer lock failed (expected if not clicked):', err);
                });
            }
        }, 500);
    });

    SOCKET.on('roundEnd', (data) => {
        console.log('Round ended:', data);
        gameState = 'ENDED';
        isAlive = false;
        
        if (controls) {
            controls.unlock();
        }
        
        document.getElementById('ui').classList.add('hidden');
        document.getElementById('roundEndScreen').classList.remove('hidden');
        
        document.getElementById('winnerAnnouncement').innerHTML = 
            `🏆 Winner: ${data.winner.name} with ${data.winner.kills} kills!`;
        
        const lbDiv = document.getElementById('finalLeaderboard');
        lbDiv.innerHTML = data.leaderboard.map((entry, i) => `
            <div class="waiting-entry ${entry.alive ? 'alive' : 'dead'}">
                <span>#${i + 1} ${entry.name}</span>
                <span>${entry.kills} kills</span>
                <span class="status-badge ${entry.alive ? 'playing' : 'dead'}">
                    ${entry.alive ? 'SURVIVED' : 'ELIMINATED'}
                </span>
            </div>
        `).join('');
    });

    SOCKET.on('worldUpdate', (state) => {
        gameState = state.state;
        
        // Update timer
        const minutes = Math.floor(state.time / 60);
        const seconds = state.time % 60;
        document.getElementById('timer').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Update players
        state.players.forEach(p => {
            if (p.id === myId) {
                // Update own stats
                document.getElementById('health').textContent = `HP: ${Math.ceil(p.hp)}`;
                document.getElementById('ammo').textContent = `Kills: ${p.kills}`;
                myKills = p.kills;
                isAlive = p.alive;
                
                if (!p.alive && controls && controls.isLocked) {
                    controls.unlock();
                }
                return;
            }
            
            updateCombatantMesh(p, false);
        });
        
        // Update bots
        state.bots.forEach(b => {
            updateCombatantMesh(b, true);
        });
        
        // Update projectiles
        updateProjectiles(state.projectiles);
        
        // Cleanup disconnected
        for (const id in meshes) {
            const stillExists = state.players.find(p => p.id === id) || state.bots.find(b => b.id === id);
            if (!stillExists) {
                scene.remove(meshes[id].group);
                delete meshes[id];
            }
        }
        
        // Update leaderboard - no [BOT] labels
        updateLeaderboard([...state.players, ...state.bots]);
        
        // Update kill feed
        if (state.killFeed) {
            const feedDiv = document.getElementById('killFeed');
            feedDiv.innerHTML = state.killFeed.map(k => 
                `<div class="killMsg">${k.msg}</div>`
            ).join('');
        }
    });

    SOCKET.on('playerFire', (data) => {
        createMuzzleFlash(data.origin, data.direction);
        
        // Spatial audio
        const dist = Math.hypot(
            data.origin.x - camera.position.x,
            data.origin.z - camera.position.z
        );
        if (dist < 50 && data.playerId !== myId) {
            playSound('shoot', 0.2 * (1 - dist/50));
        }
    });

    SOCKET.on('botFire', (data) => {
        createMuzzleFlash(data.origin, data.direction);
        
        // Spatial audio
        const dist = Math.hypot(
            data.origin.x - camera.position.x,
            data.origin.z - camera.position.z
        );
        if (dist < 50) {
            playSound('shoot', 0.2 * (1 - dist/50));
        }
    });

    SOCKET.on('hitMarker', (data) => {
        const ch = document.getElementById('crosshair');
        ch.classList.add('hit');
        if (data.kill) {
            ch.style.borderColor = '#ff0000';
            playSound('hit', 0.5);
        }
        setTimeout(() => {
            ch.classList.remove('hit');
            ch.style.borderColor = 'transparent';
        }, 150);
    });

    SOCKET.on('error', (data) => {
        alert(data.msg);
    });
}

function updateConnectionStatus(status) {
    const statusEl = document.getElementById('connectionStatus');
    statusEl.className = status;
    if (status === 'connected') {
        statusEl.textContent = 'Connected';
        setTimeout(() => statusEl.style.display = 'none', 2000);
    } else if (status === 'disconnected') {
        statusEl.textContent = 'Disconnected - Refresh page';
        statusEl.style.display = 'block';
    } else if (status === 'connecting') {
        statusEl.textContent = 'Connecting...';
    }
}

function setupInputs() {
    // CRITICAL FIX: Better keyboard handling
    document.addEventListener('keydown', (e) => {
        if (!isAlive || gameState !== 'PLAYING') return;
        
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = true;
        if (k === 'a') inputs.keys.a = true;
        if (k === 's') inputs.keys.s = true;
        if (k === 'd') inputs.keys.d = true;
        if (k === ' ') {
            e.preventDefault(); // Prevent scrolling
            inputs.keys.space = true;
        }
        if (k === 'c') inputs.keys.crouch = true;
        if (k === 'shift') inputs.keys.shift = true;
    });
    
    document.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = false;
        if (k === 'a') inputs.keys.a = false;
        if (k === 's') inputs.keys.s = false;
        if (k === 'd') inputs.keys.d = false;
        if (k === ' ') inputs.keys.space = false;
        if (k === 'c') inputs.keys.crouch = false;
        if (k === 'shift') inputs.keys.shift = false;
    });
    
    // CRITICAL FIX: Mouse click handling for shooting and pointer lock
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // Left click
            if (controls && controls.isLocked && isAlive) {
                shoot();
            } else if (gameState === 'PLAYING' && isAlive && !controls.isLocked) {
                // Try to lock pointer if clicked during game
                controls.lock().catch(err => console.log('Lock failed:', err));
            }
        }
    });
    
    document.addEventListener('mousemove', (e) => {
        if (controls && controls.isLocked) {
            inputs.yaw -= e.movementX * 0.002;
            inputs.pitch -= e.movementY * 0.002;
            inputs.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, inputs.pitch));
        }
    });
}

function shoot() {
    if (!isAlive || gameState !== 'PLAYING') return;
    
    // Recoil animation
    if (gunModel) {
        gunModel.position.z += 0.05;
        setTimeout(() => {
            if (gunModel) gunModel.position.z -= 0.05;
        }, 50);
    }
    
    // Muzzle flash
    camera.rotation.x += 0.02;
    setTimeout(() => {
        camera.rotation.x -= 0.02;
    }, 50);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    
    const origin = new THREE.Vector3();
    camera.getWorldPosition(origin);
    origin.y -= 0.2; // Gun barrel height

    SOCKET.emit('shoot', {
        origin: { x: origin.x, y: origin.y, z: origin.z },
        direction: { x: dir.x, y: dir.y, z: dir.z }
    });

    playSound('shoot', 0.3);
}

function createMuzzleFlash(origin, direction) {
    const flash = new THREE.PointLight(0xffff00, 2, 5);
    flash.position.set(origin.x, origin.y, origin.z);
    scene.add(flash);
    
    setTimeout(() => {
        scene.remove(flash);
    }, 50);
}

function playSound(type, volume = 0.5) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
}
