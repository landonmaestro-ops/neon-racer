<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyArena - FFA Deathmatch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
        }
        
        #gameCanvas { display: block; }
        
        #ui {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }
        
        #crosshair {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 20px; 
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        
        #crosshair.hit {
            animation: hitMarker 0.15s ease-out;
        }
        
        @keyframes hitMarker {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        #health {
            position: absolute; 
            bottom: 30px; 
            left: 30px;
            color: white; 
            font-size: 28px; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border-left: 4px solid #ff4444;
        }
        
        #ammo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border-right: 4px solid #4444ff;
        }
        
        #killFeed {
            position: absolute; 
            top: 20px; 
            right: 20px;
            color: white; 
            text-align: right; 
            font-size: 16px;
            text-shadow: 0 0 4px black; 
            display: flex; 
            flex-direction: column;
            gap: 5px;
            max-width: 300px;
        }
        
        .killMsg { 
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            border-right: 3px solid #ffaa00;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 10px 30px;
            border-radius: 10px;
        }
        
        #leaderboard {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            min-width: 250px;
        }
        
        #leaderboard h3 {
            margin-bottom: 10px;
            color: #ffaa00;
            border-bottom: 2px solid #ffaa00;
            padding-bottom: 5px;
        }
        
        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .leaderboard-entry.alive {
            color: #00ff00;
        }
        
        .leaderboard-entry.dead {
            color: #ff4444;
            opacity: 0.6;
        }

        #menu, #spectatorScreen, #roundEndScreen {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(20,20,40,0.95));
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            pointer-events: auto; 
            z-index: 10;
            color: white;
        }
        
        #menu h1, #spectatorScreen h1, #roundEndScreen h1 {
            font-size: 64px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ff4444, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,68,68,0.5);
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 18px;
        }
        
        .controls-info {
            display: grid;
            grid-template-columns: auto auto;
            gap: 10px 30px;
            margin: 20px 0;
            color: #ccc;
            font-size: 14px;
        }
        
        .controls-info span {
            color: #ffaa00;
            font-weight: bold;
        }
        
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .class-btn {
            padding: 20px 40px;
            font-size: 18px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .class-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        
        .class-btn.assault { border-color: #ff6600; }
        .class-btn.sniper { border-color: #00ff00; }
        .class-btn.smg { border-color: #00ffff; }
        .class-btn.shotgun { border-color: #ff00ff; }
        
        #nameInput {
            padding: 15px 25px;
            font-size: 18px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            width: 300px;
        }
        
        #nameInput::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .hidden { display: none !important; }
        
        .spectator-list {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            min-width: 400px;
        }
        
        .spectator-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }
        
        .spectator-entry.alive {
            border-left: 4px solid #00ff00;
        }
        
        .spectator-entry.dead {
            border-left: 4px solid #ff4444;
            opacity: 0.6;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-badge.alive { background: #00ff00; color: black; }
        .status-badge.dead { background: #ff4444; color: white; }
        
        #winnerAnnouncement {
            font-size: 32px;
            color: #ffaa00;
            margin: 20px 0;
            text-align: center;
        }
        
        .countdown {
            font-size: 24px;
            color: #00ffff;
            margin-top: 20px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="menu">
    <h1>PolyArena</h1>
    <div class="subtitle">Free For All Deathmatch</div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="15">
    <div class="controls-info">
        <div><span>WASD</span> Move</div>
        <div><span>SPACE</span> Jump</div>
        <div><span>C</span> Crouch / Slide</div>
        <div><span>MOUSE</span> Aim / Shoot</div>
        <div><span>SHIFT</span> Hold to Slide</div>
        <div><span>ESC</span> Release Mouse</div>
    </div>
    <div class="class-grid">
        <button class="class-btn assault" data-class="ASSAULT">Assault</button>
        <button class="class-btn sniper" data-class="SNIPER">Sniper</button>
        <button class="class-btn smg" data-class="SMG">SMG</button>
        <button class="class-btn shotgun" data-class="SHOTGUN">Shotgun</button>
    </div>
</div>

<div id="spectatorScreen" class="hidden">
    <h1>Match In Progress</h1>
    <div class="subtitle">Free For All Deathmatch</div>
    <div id="spectatorInfo"></div>
    <div class="spectator-list" id="spectatorLeaderboard"></div>
    <div class="countdown" id="spectatorCountdown"></div>
</div>

<div id="roundEndScreen" class="hidden">
    <h1>Round Over</h1>
    <div id="winnerAnnouncement"></div>
    <div class="spectator-list" id="finalLeaderboard"></div>
    <div class="countdown" id="nextRoundCountdown">Next round starting in: 60</div>
</div>

<div id="ui" class="hidden">
    <div id="crosshair"></div>
    <div id="timer">02:00</div>
    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <div id="leaderboardContent"></div>
    </div>
    <div id="killFeed"></div>
    <div id="health">HP: 100</div>
    <div id="ammo">Kills: 0</div>
</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// --- CONFIG ---
const SOCKET = io();
const WORLD_SIZE = 100;
const FOV = 90;

// --- STATE ---
let camera, scene, renderer, controls;
let myId = null;
let myClass = 'ASSAULT';
let myName = '';
let players = {};
let bots = {};
let meshes = {};
let gunModel = null;
let tracers = [];
let lastTime = performance.now();
let inputs = { 
    keys: { w: false, a: false, s: false, d: false, space: false, crouch: false, shift: false }, 
    mouseX: 0, 
    mouseY: 0,
    yaw: 0,
    pitch: 0
};
let gameState = 'LOBBY';
let myKills = 0;
let isAlive = false;
let spectatorTarget = null;
let spectatorIndex = 0;

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Materials
const matRed = new THREE.MeshLambertMaterial({ color: 0xff4444 });
const matBlue = new THREE.MeshLambertMaterial({ color: 0x4444ff });
const matGreen = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
const matYellow = new THREE.MeshLambertMaterial({ color: 0xffff00 });
const matPurple = new THREE.MeshLambertMaterial({ color: 0xff00ff });
const matCyan = new THREE.MeshLambertMaterial({ color: 0x00ffff });
const matOrange = new THREE.MeshLambertMaterial({ color: 0xff6600 });
const matBullet = new THREE.MeshBasicMaterial({ color: 0xffff00 });

const classColors = {
    ASSAULT: matOrange,
    SNIPER: matGreen,
    SMG: matCyan,
    SHOTGUN: matPurple
};

// --- INIT ---
function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

    camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // Map
    generateMap();

    // Controls
    controls = new PointerLockControls(camera, document.body);
    
    // Gun Model
    createGunModel();

    // Event Listeners
    setupUI();
    setupInputs();
    
    window.addEventListener('resize', onWindowResize);

    animate();
}

function createGunModel() {
    const gunGroup = new THREE.Group();
    
    // Main body
    const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    gunGroup.add(body);
    
    // Barrel
    const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3);
    const barrelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.z = -0.3;
    barrel.position.y = 0.05;
    gunGroup.add(barrel);
    
    // Magazine
    const magGeo = new THREE.BoxGeometry(0.08, 0.2, 0.1);
    const magMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const mag = new THREE.Mesh(magGeo, magMat);
    mag.position.y = -0.15;
    mag.position.z = 0.05;
    mag.rotation.x = -0.3;
    gunGroup.add(mag);
    
    // Scope (for sniper)
    const scopeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.15);
    const scopeMat = new THREE.MeshLambertMaterial({ color: 0x000000 });
    const scope = new THREE.Mesh(scopeGeo, scopeMat);
    scope.rotation.x = Math.PI / 2;
    scope.position.y = 0.12;
    scope.position.z = -0.05;
    scope.visible = false;
    scope.name = 'scope';
    gunGroup.add(scope);
    
    // Position relative to camera
    gunGroup.position.set(0.3, -0.3, -0.5);
    camera.add(gunGroup);
    scene.add(camera);
    
    gunModel = gunGroup;
}

function updateGunVisibility() {
    if (!gunModel) return;
    const scope = gunModel.getObjectByName('scope');
    if (scope) scope.visible = myClass === 'SNIPER';
}

function generateMap() {
    // Ground with grid pattern
    const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 50, 50);
    const pos = groundGeo.attributes.position;
    
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 2 + Math.random() * 0.3;
        pos.setZ(i, z);
    }
    groundGeo.computeVertexNormals();
    
    const groundMat = new THREE.MeshLambertMaterial({ 
        color: 0x4a6741, 
        flatShading: true 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper for visual reference
    const grid = new THREE.GridHelper(WORLD_SIZE * 2, 40, 0x000000, 0x000000);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    // Random obstacles
    for (let i = 0; i < 80; i++) {
        const type = Math.random();
        let mesh;
        
        if (type < 0.33) {
            // Rock
            const s = Math.random() * 3 + 1;
            mesh = new THREE.Mesh(
                new THREE.DodecahedronGeometry(s, 0),
                new THREE.MeshLambertMaterial({ color: 0x888888, flatShading: true })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s * 0.6,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else if (type < 0.66) {
            // Crate
            const s = Math.random() * 2 + 1;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(s, s, s),
                new THREE.MeshLambertMaterial({ color: 0x8B4513 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                s / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
        } else {
            // Wall
            const w = Math.random() * 4 + 2;
            const h = Math.random() * 3 + 2;
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, 1),
                new THREE.MeshLambertMaterial({ color: 0x555555 })
            );
            mesh.position.set(
                (Math.random() - 0.5) * WORLD_SIZE * 1.5,
                h / 2,
                (Math.random() - 0.5) * WORLD_SIZE * 1.5
            );
            mesh.rotation.y = Math.random() * Math.PI;
        }
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }
}

function setupUI() {
    document.querySelectorAll('.class-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            myClass = btn.dataset.class;
            const nameInput = document.getElementById('nameInput');
            myName = nameInput.value.trim() || `Player_${Math.floor(Math.random() * 1000)}`;
            
            SOCKET.emit('joinGame', { name: myName, classType: myClass });
        });
    });
}

function setupInputs() {
    document.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = true;
        if (k === 'a') inputs.keys.a = true;
        if (k === 's') inputs.keys.s = true;
        if (k === 'd') inputs.keys.d = true;
        if (k === ' ') inputs.keys.space = true;
        if (k === 'c') inputs.keys.crouch = true;
        if (k === 'shift') inputs.keys.shift = true;
        
        // Spectator controls
        if (gameState === 'PLAYING' && !isAlive) {
            if (k === 'arrowleft' || k === 'arrowright') {
                cycleSpectatorTarget(k === 'arrowright' ? 1 : -1);
            }
        }
    });
    
    document.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w') inputs.keys.w = false;
        if (k === 'a') inputs.keys.a = false;
        if (k === 's') inputs.keys.s = false;
        if (k === 'd') inputs.keys.d = false;
        if (k === ' ') inputs.keys.space = false;
        if (k === 'c') inputs.keys.crouch = false;
        if (k === 'shift') inputs.keys.shift = false;
    });
    
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0 && controls.isLocked && isAlive) {
            shoot();
        }
    });
    
    document.addEventListener('mousemove', (e) => {
        if (controls.isLocked) {
            inputs.yaw -= e.movementX * 0.002;
            inputs.pitch -= e.movementY * 0.002;
            inputs.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, inputs.pitch));
        }
    });
}

function cycleSpectatorTarget(direction) {
    const allCombatants = [...Object.values(players), ...Object.values(bots)].filter(p => p.alive);
    if (allCombatants.length === 0) return;
    
    spectatorIndex = (spectatorIndex + direction + allCombatants.length) % allCombatants.length;
    spectatorTarget = allCombatants[spectatorIndex];
}

function shoot() {
    // Recoil animation
    if (gunModel) {
        gunModel.position.z += 0.05;
        setTimeout(() => {
            if (gunModel) gunModel.position.z -= 0.05;
        }, 50);
    }
    
    camera.rotation.x += 0.02;
    setTimeout(() => {
        camera.rotation.x -= 0.02;
    }, 50);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    
    const origin = new THREE.Vector3();
    camera.getWorldPosition(origin);
    origin.y -= 0.2; // Gun barrel height

    SOCKET.emit('shoot', {
        origin: { x: origin.x, y: origin.y, z: origin.z },
        direction: { x: dir.x, y: dir.y, z: dir.z }
    });

    createTracer(origin, dir);
    playSound('shoot', 0.3);
}

function createTracer(origin, dir) {
    const length = 100;
    const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -length)
    ]);
    const line = new THREE.Line(geometry, matBullet);
    
    line.position.set(origin.x, origin.y, origin.z);
    line.lookAt(origin.x + dir.x * length, origin.y + dir.y * length, origin.z + dir.z * length);
    
    scene.add(line);
    tracers.push({ mesh: line, life: 0.1 });
}

function playSound(type, volume = 0.5) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
}

// --- NETWORKING ---
SOCKET.on('joined', (data) => {
    myId = data.id;
    document.getElementById('menu').classList.add('hidden');
    updateGunVisibility();
});

SOCKET.on('lobbyMode', (data) => {
    document.getElementById('menu').classList.remove('hidden');
    document.getElementById('spectatorScreen').classList.add('hidden');
    document.getElementById('roundEndScreen').classList.add('hidden');
    document.getElementById('ui').classList.add('hidden');
});

SOCKET.on('spectatorMode', (data) => {
    gameState = 'PLAYING';
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('spectatorScreen').classList.remove('hidden');
    document.getElementById('ui').classList.add('hidden');
    
    document.getElementById('spectatorInfo').innerHTML = `
        <p style="color: #ffaa00; font-size: 18px; margin-bottom: 15px;">
            ${data.message}
        </p>
        <p>Time Remaining: ${Math.ceil(data.timeRemaining)}s</p>
    `;
    
    updateSpectatorLeaderboard(data.leaderboard || []);
});

SOCKET.on('roundStart', (data) => {
    gameState = 'PLAYING';
    isAlive = true;
    myKills = 0;
    
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('spectatorScreen').classList.add('hidden');
    document.getElementById('roundEndScreen').classList.add('hidden');
    document.getElementById('ui').classList.remove('hidden');
    
    controls.lock();
});

SOCKET.on('roundEnd', (data) => {
    gameState = 'ENDED';
    isAlive = false;
    controls.unlock();
    
    document.getElementById('ui').classList.add('hidden');
    document.getElementById('roundEndScreen').classList.remove('hidden');
    
    document.getElementById('winnerAnnouncement').innerHTML = 
        `🏆 Winner: ${data.winner.name} with ${data.winner.kills} kills!`;
    
    const lbDiv = document.getElementById('finalLeaderboard');
    lbDiv.innerHTML = data.leaderboard.map((entry, i) => `
        <div class="spectator-entry ${entry.alive ? 'alive' : 'dead'}">
            <span>#${i + 1} ${entry.name} ${entry.isBot ? '(BOT)' : ''}</span>
            <span>${entry.kills} kills</span>
            <span class="status-badge ${entry.alive ? 'alive' : 'dead'}">
                ${entry.alive ? 'SURVIVED' : 'ELIMINATED'}
            </span>
        </div>
    `).join('');
    
    let countdown = 60;
    const cdDiv = document.getElementById('nextRoundCountdown');
    const interval = setInterval(() => {
        countdown--;
        cdDiv.textContent = `Next round starting in: ${countdown}`;
        if (countdown <= 0) clearInterval(interval);
    }, 1000);
});

SOCKET.on('worldUpdate', (state) => {
    gameState = state.state;
    
    // Update timer
    const minutes = Math.floor(state.time / 60);
    const seconds = state.time % 60;
    document.getElementById('timer').textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    // Update players
    state.players.forEach(p => {
        if (p.id === myId) {
            // Update own stats
            document.getElementById('health').textContent = `HP: ${Math.ceil(p.hp)}`;
            document.getElementById('ammo').textContent = `Kills: ${p.kills}`;
            myKills = p.kills;
            isAlive = p.alive;
            
            if (!p.alive && controls.isLocked) {
                controls.unlock();
                // Switch to spectator
                spectatorTarget = null;
            }
            return;
        }
        
        updateCombatantMesh(p, false);
    });
    
    // Update bots
    state.bots.forEach(b => {
        updateCombatantMesh(b, true);
    });
    
    // Cleanup disconnected
    for (const id in meshes) {
        const stillExists = state.players.find(p => p.id === id) || state.bots.find(b => b.id === id);
        if (!stillExists) {
            scene.remove(meshes[id]);
            delete meshes[id];
        }
    }
    
    // Update leaderboard
    updateLeaderboard([...state.players, ...state.bots]);
    
    // Update kill feed
    if (state.killFeed) {
        const feedDiv = document.getElementById('killFeed');
        feedDiv.innerHTML = state.killFeed.map(k => 
            `<div class="killMsg">${k.msg}</div>`
        ).join('');
    }
});

function updateCombatantMesh(data, isBot) {
    if (!meshes[data.id]) {
        const group = new THREE.Group();
        
        // Body
        const bodyColor = classColors[data.classType] || matBlue;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), bodyColor);
        body.position.y = 0.9;
        body.castShadow = true;
        group.add(body);
        
        // Head
        const head = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5), 
            new THREE.MeshLambertMaterial({color: 0xffccaa})
        );
        head.position.y = 2.0;
        group.add(head);
        
        // Gun
        const gun = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.1, 0.4),
            new THREE.MeshLambertMaterial({color: 0x333333})
        );
        gun.position.set(0.3, 1.3, 0.3);
        group.add(gun);
        
        // Name tag
        // (Simplified - in full game add canvas texture)
        
        scene.add(group);
        meshes[data.id] = group;
    }
    
    const mesh = meshes[data.id];
    mesh.position.set(data.x, data.y, data.z);
    mesh.quaternion.set(data.qx, data.qy, data.qz, data.qw);
    
    // Slide animation
    if (data.sliding) {
        mesh.scale.set(1.3, 0.6, 1.3);
    } else {
        mesh.scale.set(1, 1, 1);
    }
    
    // Death animation (fall over)
    if (!data.alive) {
        mesh.rotation.x = Math.PI / 2;
        mesh.position.y = 0.5;
    }
}

function updateLeaderboard(allCombatants) {
    allCombatants.sort((a, b) => {
        if (a.alive && !b.alive) return -1;
        if (!a.alive && b.alive) return 1;
        return b.kills - a.kills;
    });
    
    const lbDiv = document.getElementById('leaderboardContent');
    lbDiv.innerHTML = allCombatants.slice(0, 10).map((p, i) => `
        <div class="leaderboard-entry ${p.alive ? 'alive' : 'dead'}">
            <span>${i + 1}. ${p.name}${p.id?.startsWith('bot') ? ' [BOT]' : ''}</span>
            <span>${p.kills}</span>
        </div>
    `).join('');
}

function updateSpectatorLeaderboard(leaderboard) {
    const div = document.getElementById('spectatorLeaderboard');
    div.innerHTML = leaderboard.map((entry, i) => `
        <div class="spectator-entry ${entry.alive ? 'alive' : 'dead'}">
            <span>#${i + 1} ${entry.name}</span>
            <span>${entry.kills} kills</span>
            <span class="status-badge ${entry.alive ? 'alive' : 'dead'}">
                ${entry.alive ? 'ALIVE' : 'DEAD'}
            </span>
        </div>
    `).join('');
}

SOCKET.on('tracer', (data) => {
    createTracer(data.origin, data.direction);
    
    // Spatial audio
    const dist = Math.hypot(
        data.origin.x - camera.position.x,
        data.origin.z - camera.position.z
    );
    if (dist < 50) {
        playSound('shoot', 0.2 * (1 - dist/50));
    }
});

SOCKET.on('hitMarker', (data) => {
    const ch = document.getElementById('crosshair');
    ch.classList.add('hit');
    if (data.kill) {
        ch.style.borderColor = '#ff0000';
        playSound('hit', 0.5);
    }
    setTimeout(() => {
        ch.classList.remove('hit');
        ch.style.borderColor = 'transparent';
    }, 150);
});

SOCKET.on('killFeed', (data) => {
    // Handled in worldUpdate
});

SOCKET.on('error', (data) => {
    alert(data.msg);
});

// --- MAIN LOOP ---
function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (gameState === 'PLAYING') {
        if (isAlive && controls.isLocked) {
            // Send inputs to server
            SOCKET.emit('input', {
                keys: inputs.keys,
                quaternion: { 
                    x: camera.quaternion.x, 
                    y: camera.quaternion.y, 
                    z: camera.quaternion.z, 
                    w: camera.quaternion.w 
                },
                yaw: inputs.yaw,
                pitch: inputs.pitch
            });
            
            // Apply local rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = inputs.yaw;
            camera.rotation.x = inputs.pitch;
            
        } else if (!isAlive) {
            // Spectator mode - follow target
            if (!spectatorTarget) {
                // Find first alive target
                const all = [...Object.values(players), ...Object.values(bots)].filter(p => p.alive);
                if (all.length > 0) {
                    spectatorTarget = all[0];
                }
            }
            
            if (spectatorTarget) {
                // Smooth follow
                const targetPos = new THREE.Vector3(
                    spectatorTarget.position?.x || spectatorTarget.x,
                    spectatorTarget.position?.y || spectatorTarget.y,
                    spectatorTarget.position?.z || spectatorTarget.z
                );
                camera.position.lerp(targetPos.clone().add(new THREE.Vector3(0, 5, 10)), 0.05);
                camera.lookAt(targetPos);
            }
        }
    }

    // Update tracers
    for (let i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        if (tracers[i].life <= 0) {
            scene.remove(tracers[i].mesh);
            tracers.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
