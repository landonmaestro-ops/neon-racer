<!DOCTYPE html>
<html>
<head>
    <title>Neon Racer 2026</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0ff; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">WASD to Drive | Neon Racer Multiplayer</div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const socket = io();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Bloom (Neon Glow)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer.addPass(bloom);

        const grid = new THREE.GridHelper(500, 100, 0xff00ff, 0x222222);
        scene.add(grid);

        let playerCar;
        const otherPlayers = {};

        function createCar(color = 0x00ffff) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 2.5), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2 }));
            group.add(body);
            return group;
        }

        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === socket.id) {
                    playerCar = createCar(0x00ffff);
                    scene.add(playerCar);
                } else {
                    otherPlayers[id] = createCar(0xff00ff);
                    scene.add(otherPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (data) => {
            otherPlayers[data.id] = createCar(0xff00ff);
            scene.add(otherPlayers[data.id]);
        });

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].position.set(data.info.x, 0.25, data.info.z);
                otherPlayers[data.id].rotation.y = data.info.rot;
            }
        });

        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        let speed = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (playerCar) {
                if (keys['w']) speed += 0.005;
                if (keys['s']) speed -= 0.005;
                speed *= 0.96;
                playerCar.translateZ(speed);
                if (keys['a']) playerCar.rotation.y += 0.04;
                if (keys['d']) playerCar.rotation.y -= 0.04;

                socket.emit('playerMovement', { x: playerCar.position.x, z: playerCar.position.z, rot: playerCar.rotation.y });

                const camPos = new THREE.Vector3(0, 3, -7).applyMatrix4(playerCar.matrixWorld);
                camera.position.lerp(camPos, 0.1);
                camera.lookAt(playerCar.position);
            }
            composer.render();
        }
        animate();
    </script>
</body>
</html>
